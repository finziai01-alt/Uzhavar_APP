<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8ff" />
    <title>Reset Password — FreshGrocer Ops Core</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js" defer></script>
    <script defer>
      (() => {
        'use strict';
        const form = document.getElementById('reset-form');
        const msg = document.getElementById('message');
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('access_token');
        const refreshToken = urlParams.get('refresh_token');
        const type = urlParams.get('type'); // 'recovery' or 'update'

        if (type === 'recovery' && accessToken && refreshToken) {
          // Supabase email confirmation / password reset redirect
          form.innerHTML = `
            <div class="field">
              <label>New password</label>
              <input type="password" id="new-password" required minlength="8" autocomplete="new-password"/>
            </div>
            <div class="field">
              <label>Confirm password</label>
              <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password"/>
            </div>
            <button class="btn btn-primary" id="update-btn">Update Password</button>
          `;
          document.getElementById('update-btn').addEventListener('click', async () => {
            const np = document.getElementById('new-password').value;
            const cp = document.getElementById('confirm-password').value;
            if (np !== cp) {
              msg.textContent = 'Passwords do not match.';
              msg.style.color = '#ba1a1a';
              return;
            }
            try {
              // Use Supabase REST API to update password with the recovery token
              const config = window.FRESHGROCER_CONFIG || {};
              const res = await fetch(`${config.supabaseUrl}/auth/v1/user`, {
                method: 'PUT',
                headers: {
                  'apikey': config.supabaseAnonKey,
                  'Authorization': `Bearer ${accessToken}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ password: np }),
              });
              if (!res.ok) throw new Error('Failed to update password');
              msg.textContent = 'Password updated successfully. You can now sign in.';
              msg.style.color = '#006948';
              setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            } catch (e) {
              msg.textContent = e.message;
              msg.style.color = '#ba1a1a';
            }
          });
          return;
        }

        // Default: forgot password form
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value;
          try {
            const config = window.FRESHGROCER_CONFIG || {};
            const res = await fetch(`${config.supabaseUrl}/auth/v1/recover`, {
              method: 'POST',
              headers: {
                'apikey': config.supabaseAnonKey,
                'Authorization': `Bearer ${config.supabaseAnonKey}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                email,
                options: { redirectTo: `${window.location.origin}/reset-password.html` },
              }),
            });
            if (!res.ok) throw new Error('Failed to send reset email');
            msg.textContent = 'If an account exists, a reset link has been sent.';
            msg.style.color = '#006948';
          } catch (e) {
            msg.textContent = e.message;
            msg.style.color = '#ba1a1a';
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">&#x1F491;</div>
        <div class="brand-title">FreshGrocer Ops</div>
        <div class="brand-sub">Password Reset</div>
      </div>
      <form id="reset-form">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="email" required placeholder="admin@freshgrocer.example.test" autocomplete="email"/>
        </div>
        <button class="btn btn-primary" type="submit">Send Reset Link</button>
      </form>
      <div id="message" style="margin-top:12px;font-size:11px;min-height:16px;"></div>
      <p style="margin-top:16px;font-size:11px;color:var(--muted);text-align:center;">
        Remember your password? <a href="index.html" style="color:var(--green);">Sign in</a>
      </p>
    </div>
  </body>
</html>
